; stunnel for the Ambition of the Illuminus PC login (experimental).
; It ends the client's SSL 3.0 and forwards plain TCP to the login service.
;
; Runs in the openlobby-ssl3 image (OpenSSL 1.1.1 built with SSLv3, and stunnel), mounted as
; /etc/stunnel/stunnel.conf. Its entrypoint mints a CA and an RSA-1024 / SHA-1 leaf with
; CN=$SSL3_CN at $SSL3_CERT; the client does not check the certificate, any RSA one works.
; The PS2 client offers record version 3.0 and one suite, 0x0005 (RC4-SHA). SSLv3 and RC4 are what
; the 2006 disc speaks: this is compatibility, not security. Never put anything else behind it.

foreground = yes
debug = 5
output = /dev/stdout
pid =

; The PC client offers more suites than the PS2 and presents a client certificate, which stunnel
; neither asks for nor checks.
[aoti-pc-login]
accept  = 0.0.0.0:12230
connect = login:22230
cert = /certs/ssl3-pc.pem
sslVersionMin = SSLv3
sslVersionMax = SSLv3
options = -NO_SSLv3
ciphers = RC4-SHA:DES-CBC3-SHA:AES128-SHA:@SECLEVEL=0
renegotiation = no
