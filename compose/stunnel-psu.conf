; stunnel for the Phantasy Star Universe login and the game server.
; It ends the client's SSL 3.0 and forwards plain TCP to the login and game services.
;
; Runs in the openlobby-ssl3 image (OpenSSL 1.1.1 built with SSLv3, and stunnel), mounted as
; /etc/stunnel/stunnel.conf. Its entrypoint mints a CA and an RSA-1024 / SHA-1 leaf with
; CN=$SSL3_CN at $SSL3_CERT; the client does not check the certificate, any RSA one works.
; The PS2 client offers record version 3.0 and one suite, 0x0005 (RC4-SHA). SSLv3 and RC4 are what
; the 2006 disc speaks: this is compatibility, not security. Never put anything else behind it.

foreground = yes
debug = 5
output = /dev/stdout
pid =

[psu-login]
accept  = 0.0.0.0:12110
connect = login:22110
cert = /certs/ssl3-psu.pem
sslVersionMin = SSLv3
sslVersionMax = SSLv3
options = -NO_SSLv3
ciphers = RC4-SHA:@SECLEVEL=0
renegotiation = no

; The game server leg: login's 0x0216 sends both discs here (PSU_GAME_ADDR, port 12061).
[psu-game]
accept  = 0.0.0.0:12061
connect = game:22061
cert = /certs/ssl3-psu.pem
sslVersionMin = SSLv3
sslVersionMax = SSLv3
options = -NO_SSLv3
ciphers = RC4-SHA:@SECLEVEL=0
renegotiation = no
